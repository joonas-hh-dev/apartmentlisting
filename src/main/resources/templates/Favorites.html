<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <title>Omat suosikit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h2>Omat suosikit</h2>
    <table class="table table-striped">
        <tr>
            <th>Kaupunki</th>
            <th>Osoite</th>
            <th>Tyyppi</th>
            <th>Huoneita</th>
            <th>Rakennusvuosi</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="favorite: ${favorites}" th:with="apartment=${favorite.apartment}">
            <td th:text="${apartment.city}"></td>
            <td th:text="${apartment.address}"></td>
            <td th:text="${apartment.type}"></td>
            <td th:text="${apartment.rooms}"></td>
            <td th:text="${apartment.yearBuilt}"></td>
            <td>
                <a th:href="@{/apartments/{id}(id=${apartment.id})}" class="btn btn-primary">Näytä</a>
            </td>
            <td>
                <form th:action="@{/favorites/delete/{id}(id=${apartment.id})}" method="post">
                    <button type="submit" class="btn btn-danger" title="Poista suosikeista">
                        Poista
                    </button>
                </form>
            </td>
        </tr>
    </table>
    <div class="d-flex gap-2">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary">
                Kirjaudu ulos
            </button>
        </form>
        <a th:href="@{/apartments}" class="btn btn-info">Etusivulle</a>
    </div>
</body>
</html>
