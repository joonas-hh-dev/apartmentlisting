<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <title>Myytävät asunnot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h2>Myytävät asunnot</h2>
    <table class="table table-striped">
        <tr>
            <th>Kaupunki</th>
            <th>Osoite</th>
            <th>Tyyppi</th>
            <th>Huoneita</th>
            <th>Rakennusvuosi</th>
            <th></th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="apartment: ${apartments}">
            <td th:text="${apartment.city}"></td>
            <td th:text="${apartment.address}"></td>
            <td th:text="${apartment.type}"></td>
            <td th:text="${apartment.rooms}"></td>
            <td th:text="${apartment.yearBuilt}"></td>
            <td>
                <a th:href="@{/apartments/{id}(id=${apartment.id})}" class="btn btn-primary">Näytä</a>
            </td>
            <td>
                <form th:if="${favorites != null}" th:action="${favorites.![apartment].contains(apartment)} ? @{/favorites/delete/{id}(id=${apartment.id})} : @{/favorites/add/{id}(id=${apartment.id})}" method="post">
                    <button type="submit" class="btn btn-link text-decoration-none p-1" title="Lisää suosikiksi">
                        <span th:if="${favorites.![apartment].contains(apartment)}">★</span>
                        <span th:unless="${favorites.![apartment].contains(apartment)}">☆</span>
                    </button>
                </form>
            </td>
            <td>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/apartments/edit/{id}(id=${apartment.id})}" class="btn btn-info">Muokkaa</a>
            </td>
            <td>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/apartments/delete/{id}(id=${apartment.id})}" class="btn btn-danger">Poista</a>
            </td>
        </tr>
    </table>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/apartments/add}" class="btn btn-primary">Lisää asunto</a>
     <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-primary">
            Kirjaudu ulos
        </button>
     </form>
     <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-info">Kirjaudu sisään</a>
</body>
</html>
