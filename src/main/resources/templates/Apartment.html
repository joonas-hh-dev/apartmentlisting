<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <title th:text="${apartment.address}"></title>
</head>
<body>
    <h2 th:text="${apartment.address}"></h2>
    <p>Tyyppi: <span th:text="${apartment.type}"></span></p>
    <p>Osoite: <span th:text="${apartment.address}"></span></p>
    <p>Postinumero: <span th:text="${apartment.zipCode}"></span></p>
    <p>Kaupunki: <span th:text="${apartment.city}"></span></p>
    <p>Huoneita: <span th:text="${apartment.rooms}"></span></p>
    <p>Pinta-ala: <span th:text="${apartment.area}"></span></p>
    <p>Kerros: <span th:text="${apartment.floor}"></span></p>
    <p>Rakennusvuosi: <span th:text="${apartment.yearBuilt}"></span></p>
    <p>Myyjä:  <span th:text="${apartment.seller.firstName + ' ' + apartment.seller.lastName}"></span></p>
    <a th:href="'tel:' + ${apartment.seller.phoneNumber}" th:text="'Soita'"></a>
    <a th:href="'mailto:' + ${apartment.seller.email}" th:text="'Lähetä sähköpostia'"></a>
</body>
</html>
